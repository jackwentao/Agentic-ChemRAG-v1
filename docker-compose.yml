services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chemrag
      POSTGRES_USER: chemrag
      POSTGRES_PASSWORD: chemrag
    ports:
      - "5432:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemrag -d chemrag"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chemrag
      MINIO_ROOT_PASSWORD: chemrag-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./storage/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_AUTO_PREPARE: "false"
      DATABASE_URL: postgresql+psycopg://chemrag:chemrag@postgres:5432/chemrag
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: chemrag
      MINIO_SECRET_KEY: chemrag-secret
      MINIO_BUCKET: chemrag
      MINIO_SECURE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-replace-me}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-false}
      RERANKER_LOCAL_FILES_ONLY: ${RERANKER_LOCAL_FILES_ONLY:-false}
      HF_HOME: /app/storage/models
      HUGGINGFACE_HUB_CACHE: /app/storage/models
    volumes:
      - ./storage/models:/app/storage/models
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./storage/models:/app/storage/models
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.app.tasks.celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    environment:
      <<: *backend-env
    volumes:
      - ./storage/models:/app/storage/models
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
